<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pira — Mockup 2 · Pulse Grid</title>
<style>
:root{
  --bg:#0e1013;--panel:#15181d;--card:#1b1f25;--card-h:#222730;--line:#252a33;--line-2:#323946;
  --text:#e9edf3;--muted:#8a93a3;--faint:#566070;
  --cyan:#00e5ff;--cyan-ink:#001f24;--glow:0 0 0 1px rgba(0,229,255,.6),0 0 22px rgba(0,229,255,.22);
  --story:#3ddc97;--bug:#ff5c7a;--task:#4aa3ff;--epic:#b38bff;--warn:#ff5c7a;
  --cond:"Bahnschrift SemiCondensed","Bahnschrift","Segoe UI",sans-serif;
  --sans:"Segoe UI Variable Text","Segoe UI",sans-serif;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

.app{position:relative;z-index:1;display:grid;grid-template-columns:64px var(--pp,232px) 1fr;height:100vh;transition:grid-template-columns .22s}
.app.slim{--pp:0px}

/* icon rail */
.rail{background:#0a0b0e;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.logo{width:38px;height:38px;display:grid;place-items:center;margin-bottom:14px;filter:drop-shadow(0 0 10px rgba(0,229,255,.55))}
.r-btn{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative}
.r-btn:hover{color:var(--text);background:var(--panel)}
.r-btn.on{color:var(--cyan);background:rgba(0,229,255,.1)}
.r-btn.on::before{content:"";position:absolute;left:-11px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.r-btn[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;white-space:nowrap;background:var(--card);border:1px solid var(--line-2);padding:4px 8px;border-radius:5px;font-size:12px;color:var(--text);z-index:9}
.rail .grow{flex:1}
.r-create{width:42px;height:42px;border-radius:12px;background:var(--cyan);color:var(--cyan-ink);font:700 22px/1 var(--sans);box-shadow:0 0 20px rgba(0,229,255,.45)}
.me{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#00e5ff,#0066ff);display:grid;place-items:center;color:#04161a;font:700 12px var(--sans);margin-top:8px}

/* project panel */
.pp{background:var(--panel);border-right:1px solid var(--line);overflow:hidden;white-space:nowrap}
.pp-in{width:232px;padding:18px 14px}
.pp-h{font:600 11px var(--cond);letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin:4px 6px 10px}
.proj-sw{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line-2);border-radius:10px;background:var(--card);width:100%;text-align:left}
.proj-sw:hover{border-color:var(--cyan)}
.p-av{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--cond);color:#071316;background:var(--cyan)}
.proj-sw small{display:block;color:var(--muted);font-size:11.5px}
.pp nav{margin-top:18px;display:grid;gap:2px}
.pp nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13.5px}
.pp nav a:hover{background:var(--card);color:var(--text)}
.pp nav a.on{color:var(--text);background:var(--card);box-shadow:inset 2px 0 0 var(--cyan)}
.pp nav a .ct{margin-left:auto;font:500 11px var(--mono);color:var(--faint)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.bar{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line)}
.toggle-pp{color:var(--muted);width:30px;height:30px;border-radius:6px}.toggle-pp:hover{background:var(--panel);color:var(--text)}
.crumb{font:500 12px var(--mono);color:var(--faint)}
.crumb b{color:var(--cyan);font-weight:500}
.title{font:600 26px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase}
.title span{color:var(--cyan);text-shadow:0 0 18px rgba(0,229,255,.5)}
.spacer{flex:1}
.kbd{font:500 11px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--muted)}
.find{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line-2);width:260px;color:var(--muted)}
.find:focus-within{box-shadow:var(--glow);border-color:transparent}
.find input{background:none;border:0;outline:none;width:100%;color:var(--text)}
.filters{display:flex;align-items:center;gap:8px;padding:10px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fchip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.fchip:hover{color:var(--text);border-color:var(--muted)}
.fchip[aria-pressed="true"]{color:var(--cyan-ink);background:var(--cyan);border-color:var(--cyan);font-weight:600}
.sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{padding:5px 12px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--card-h);color:var(--cyan)}

/* board */
.board{flex:1;overflow:auto;padding:0 22px 80px}
.heads{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;padding:14px 0 10px;background:linear-gradient(var(--bg) 80%,transparent)}
.h{display:flex;align-items:center;gap:8px;font:600 13px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-radius:8px;background:var(--panel);border-top:2px solid var(--hc)}
.h .wip{margin-left:auto;font:500 11px var(--mono);color:var(--faint)}
.h.over{box-shadow:inset 0 0 0 1px var(--warn)}.h.over .wip{color:var(--warn)}
.lane{margin-top:6px}
.lane-h{display:flex;align-items:center;gap:10px;padding:8px 4px;color:var(--muted);font-size:13px;width:100%;text-align:left}
.lane-h:hover{color:var(--text)}
.lane-h .chev{transition:transform .15s;display:inline-block}
.lane.closed .chev{transform:rotate(-90deg)}
.lane.closed .lane-g{display:none}
.lane-h b{color:var(--text);font-weight:600}
.lane-h .ct{font:500 11px var(--mono);color:var(--faint)}
.lane-g{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px}
.cell{min-height:64px;border-radius:10px;padding:6px;background:rgba(21,24,29,.6);border:1px dashed transparent;display:flex;flex-direction:column;gap:6px;transition:.15s}
.cell.drop{border-color:var(--cyan);background:rgba(0,229,255,.06)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 14px;cursor:pointer;overflow:hidden;transition:.14s;animation:in .3s ease both}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc)}
.card:hover{background:var(--card-h);transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.card:focus-visible{box-shadow:var(--glow);outline:none}
.card .k{font:500 11.5px var(--mono);color:var(--cyan);letter-spacing:.02em}
.card p{margin:4px 0 10px;font-size:13.5px;line-height:1.35}
.row{display:flex;align-items:center;gap:6px}
.tag{font:500 10.5px var(--mono);color:var(--muted);border:1px solid var(--line-2);padding:0 5px;border-radius:4px}
.row .spacer{flex:1}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font:700 10px var(--sans);color:#0b0d10;background:var(--c)}
.av.lg{width:30px;height:30px;font-size:11px}
.av.none{background:transparent;border:1px dashed var(--line-2);color:var(--faint)}
.quick{display:none;padding:8px;border-radius:8px;border:1px solid var(--cyan);background:var(--card);box-shadow:var(--glow)}
.quick.open{display:block}
.quick input{width:100%;background:none;border:0;outline:none}
.quick small{display:block;color:var(--faint);margin-top:6px;font-size:11px}
.add{color:var(--faint);font-size:12.5px;padding:6px 8px;border-radius:6px;text-align:left;opacity:0;transition:.15s}
.cell:hover .add,.add:focus-visible{opacity:1}
.add:hover{color:var(--cyan);background:rgba(0,229,255,.06)}
@keyframes in{from{opacity:0;transform:translateY(4px)}}

/* issue modal (Jira full issue view) */
.scrim{position:fixed;inset:0;background:rgba(3,5,8,.72);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:40;overflow:auto}
.scrim.open{display:flex}
.issue{width:min(1080px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 0 1px rgba(0,229,255,.08);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.99)}}
.i-top{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.i-top .k{font:500 13px var(--mono);color:var(--cyan)}
.i-top .crumb2{color:var(--faint);font:500 12px var(--mono)}
.ib{width:32px;height:32px;border-radius:7px;color:var(--muted)}.ib:hover{background:var(--card);color:var(--text)}
.i-grid{display:grid;grid-template-columns:1fr 340px}
.i-left{padding:22px 28px 30px;border-right:1px solid var(--line)}
.i-left h2{font:600 26px/1.2 var(--cond);letter-spacing:.01em;margin-bottom:14px;outline:none;border-radius:6px;padding:2px 4px;margin-left:-4px}
.i-left h2:hover{background:var(--card)}
.qa{display:flex;gap:8px;margin-bottom:22px}
.qa button{padding:6px 12px;border-radius:7px;background:var(--card);border:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.qa button:hover{color:var(--text)}
.lbl-t{font:600 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px}
.desc{line-height:1.6;color:#cdd3dd}
.desc ul{margin:8px 0 0 18px}
.sub{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sub div{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.sub div:first-child{border-top:0}
.sub .k{font:500 12px var(--mono);color:var(--cyan)}
.bar2{flex:1;height:4px;border-radius:4px;background:var(--line-2);overflow:hidden;max-width:120px}.bar2 i{display:block;height:100%;background:var(--cyan)}
.feed{display:grid;gap:14px}
.post{display:flex;gap:10px}
.post .bub{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.post small{color:var(--faint)}
.post.h .bub{background:none;border:0;padding:4px 0;color:var(--muted);font-size:13px}
.post.h b{color:var(--text)}
.chip{font:500 11px var(--mono);padding:1px 6px;border-radius:4px;background:var(--card-h);color:var(--text)}
.composer textarea{width:100%;min-height:44px;resize:vertical;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;outline:none}
.composer textarea:focus{box-shadow:var(--glow);border-color:transparent}
.i-right{padding:22px 22px 30px;display:grid;gap:16px;align-content:start}
.status{display:flex;gap:8px}
.status select{flex:1;appearance:none;padding:9px 12px;border-radius:8px;font:600 12.5px var(--cond);letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;cursor:pointer}
.st-todo{background:#272d36;color:#c5ccd7}.st-progress{background:rgba(0,229,255,.14);color:var(--cyan)}.st-review{background:rgba(179,139,255,.16);color:var(--epic)}.st-done{background:rgba(61,220,151,.15);color:var(--story)}
.box{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.box summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;display:flex;justify-content:space-between;background:var(--card)}
.box summary::-webkit-details-marker{display:none}
.box dl{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:14px}
.box dt{color:var(--muted);font-size:13px;padding-top:3px}
.box dd{display:flex;align-items:center;gap:8px;font-size:13.5px}
.meta-foot{color:var(--faint);font-size:12px;line-height:1.7}

.toast{position:fixed;right:22px;bottom:70px;background:var(--card);border:1px solid var(--line-2);border-left:3px solid var(--cyan);padding:10px 14px;border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);transform:translateY(20px);opacity:0;transition:.2s;z-index:60}
.toast.show{transform:none;opacity:1}

.mock-pill{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:rgba(10,11,14,.92);border:1px solid var(--line-2);border-radius:999px;z-index:100}
.mock-pill a{min-width:30px;height:30px;padding:0 10px;border-radius:999px;display:grid;place-items:center;color:var(--muted);text-decoration:none;font:600 12px var(--mono)}
.mock-pill a:hover{color:var(--text);background:var(--card)}
.mock-pill a.on{background:var(--cyan);color:var(--cyan-ink);box-shadow:0 0 14px rgba(0,229,255,.5)}
.mock-pill span{padding:0 10px 0 8px;display:grid;place-items:center;color:var(--faint);font-size:12px}
@media (max-width:980px){.app{--pp:0px}.i-grid{grid-template-columns:1fr}.i-left{border-right:0;border-bottom:1px solid var(--line)}.find{width:180px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Global">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 26 26" aria-label="Pira"><path d="M13 1.5 24.5 13 13 24.5 1.5 13Z" fill="none" stroke="#00e5ff" stroke-width="2"/><path d="M10.2 7.8h4a3.4 3.4 0 0 1 0 6.8h-1.7V18h-2.3z" fill="#00e5ff"/></svg></div>
    <button class="r-btn" data-tip="Your work" aria-label="Your work"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></button>
    <button class="r-btn on" data-tip="Projects" aria-label="Projects"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg></button>
    <button class="r-btn" data-tip="Filters" aria-label="Filters"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button>
    <button class="r-btn" data-tip="Dashboards" aria-label="Dashboards"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="10" rx="1.5"/><rect x="13" y="3" width="8" height="6" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="15" width="8" height="6" rx="1.5"/></svg></button>
    <div class="grow"></div>
    <button class="r-create" id="railCreate" aria-label="Create issue" title="Create (C)">+</button>
    <span class="me" title="You">DW</span>
  </nav>

  <aside class="pp" aria-label="Project">
    <div class="pp-in">
      <div class="pp-h">Project</div>
      <button class="proj-sw"><span class="p-av">PIRA</span><span><b>Pira Platform</b><small>Kanban · 5 members</small></span></button>
      <nav>
        <a href="#" class="on"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="2" width="3.5" height="12" rx="1"/><rect x="6.3" y="2" width="3.5" height="8" rx="1"/><rect x="11" y="2" width="3.5" height="10" rx="1"/></svg>Board<span class="ct" id="ctBoard"></span></a>
        <a href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h9M5 8h9M5 12h9M2 4h.5M2 8h.5M2 12h.5"/></svg>Issues<span class="ct">128</span></a>
        <a href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M8 4v4l3 2"/></svg>Overview</a>
        <a href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="2.5"/><path d="M1.5 14c.5-2.5 2.3-4 4.5-4s4 1.5 4.5 4"/></svg>Members<span class="ct">5</span></a>
        <a href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2"/></svg>Settings</a>
      </nav>
      <div class="pp-h" style="margin-top:26px">Recent projects</div>
      <nav>
        <a href="#"><span class="p-av" style="width:22px;height:22px;font-size:9px;background:#ff9f6e">WEB</span>Website Revamp</a>
        <a href="#"><span class="p-av" style="width:22px;height:22px;font-size:9px;background:#b38bff">OPS</span>Ops Toolkit</a>
      </nav>
    </div>
  </aside>

  <main class="main">
    <div class="bar">
      <button class="toggle-pp" id="togglePP" aria-label="Toggle project panel">☰</button>
      <div><div class="crumb">projects / <b>pira</b> / board</div><div class="title">Pira <span>Board</span></div></div>
      <div class="spacer"></div>
      <label class="find"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="m11 11 4 4"/></svg><span class="sr">Search</span><input id="q" placeholder="Filter cards…"><span class="kbd">/</span></label>
    </div>
    <div class="filters" role="toolbar" aria-label="Quick filters">
      <button class="fchip" data-f="mine" aria-pressed="false">Only my issues</button>
      <button class="fchip" data-f="recent" aria-pressed="false">Recently updated</button>
      <span class="sep"></span>
      <button class="fchip" data-type="bug" aria-pressed="false"><svg width="10" height="10"><circle cx="5" cy="5" r="5" fill="#ff5c7a"/></svg>Bugs</button>
      <button class="fchip" data-type="story" aria-pressed="false"><svg width="10" height="10"><circle cx="5" cy="5" r="5" fill="#3ddc97"/></svg>Stories</button>
      <button class="fchip" data-pri="high" aria-pressed="false">↑ High+</button>
      <div class="spacer"></div>
      <span style="color:var(--faint);font-size:12px">Group by</span>
      <div class="seg" role="group" aria-label="Group by"><button class="on" data-g="assignee">Assignee</button><button data-g="none">None</button></div>
    </div>
    <div class="board" id="board"></div>
  </main>
</div>

<div class="scrim" id="scrim">
  <div class="issue" role="dialog" aria-modal="true" aria-labelledby="iTitle" id="issue"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav class="mock-pill" aria-label="Mockups"><span>Pira mockups</span><a href="mockup-1.html">1</a><a class="on" href="mockup-2.html">2</a><a href="mockup-3.html">3</a><a href="mockup-4.html">4</a><a href="mockup-5.html">5</a></nav>

<script>
const people={AM:{n:'Alex Morgan',c:'#00e5ff'},PS:{n:'Priya Shah',c:'#ff9f6e'},JL:{n:'Jordan Lee',c:'#b38bff'},SO:{n:'Sam Ortiz',c:'#3ddc97'},RK:{n:'Riley Kim',c:'#ffd166'}};
const cols=[{id:'todo',n:'To Do',c:'#8a93a3'},{id:'progress',n:'In Progress',c:'#00e5ff',wip:3},{id:'review',n:'In Review',c:'#b38bff',wip:3},{id:'done',n:'Done',c:'#3ddc97'}];
const tc={story:'var(--story)',bug:'var(--bug)',task:'var(--task)',epic:'var(--epic)'};
const hex={story:'#3ddc97',bug:'#ff5c7a',task:'#4aa3ff',epic:'#b38bff'};
let issues=[
 {k:'PIRA-101',s:'Allocate issue keys server-side with a sequence table',t:'story',p:'high',a:'AM',st:'todo',l:['backend'],r:'PS',u:1},
 {k:'PIRA-102',s:'Board drag-and-drop loses rank after refresh',t:'bug',p:'highest',a:'PS',st:'progress',l:['board'],r:'JL',u:1},
 {k:'PIRA-103',s:'Comment composer supports @mentions',t:'story',p:'medium',a:'JL',st:'progress',l:['ux'],r:'AM'},
 {k:'PIRA-104',s:'My Work overdue tab shows resolved issues',t:'bug',p:'high',a:'SO',st:'review',l:['my-work'],r:'RK',u:1},
 {k:'PIRA-105',s:'Project settings — member roles',t:'task',p:'medium',a:'AM',st:'todo',l:['settings'],r:'AM'},
 {k:'PIRA-106',s:'Issue history timeline',t:'task',p:'low',a:'RK',st:'done',l:['history'],r:'SO'},
 {k:'PIRA-107',s:'Phase 1 — Foundation & issue tracker',t:'epic',p:'medium',a:'AM',st:'progress',l:['roadmap'],r:'AM'},
 {k:'PIRA-108',s:'Keyboard shortcuts: C to create, / to search',t:'task',p:'lowest',a:'PS',st:'todo',l:['a11y'],r:'JL'},
 {k:'PIRA-109',s:'Archive projects instead of deleting them',t:'story',p:'medium',a:null,st:'review',l:['projects'],r:'PS'},
 {k:'PIRA-110',s:'Search by key and summary with paging',t:'story',p:'high',a:'JL',st:'done',l:['search'],r:'AM'},
 {k:'PIRA-111',s:'Empty and error states for the board',t:'task',p:'low',a:'SO',st:'todo',l:['ux'],r:'RK',u:1},
 {k:'PIRA-112',s:'Status change writes a history event',t:'bug',p:'medium',a:'RK',st:'progress',l:['backend'],r:'PS'}
];
let seq=112,group='assignee',f={q:'',mine:false,recent:false,type:'',pri:''},closed=new Set();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pri={highest:['#ff5c5c','M3 9l5-4 5 4M3 13l5-4 5 4'],high:['#ff8a4c','M3 11l5-5 5 5'],medium:['#ffb547','M3 6h10M3 10h10'],low:['#4aa3ff','M3 5l5 5 5-5'],lowest:['#4aa3ff','M3 3l5 4 5-4M3 7l5 4 5-4']};
const priIcon=p=>`<svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="${p} priority"><path d="${pri[p][1]}" stroke="${pri[p][0]}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const av=(id,c='')=>id?`<span class="av ${c}" style="--c:${people[id].c}" title="${people[id].n}">${id}</span>`:`<span class="av none ${c}" title="Unassigned">?</span>`;
const typeName=t=>t[0].toUpperCase()+t.slice(1);
function ok(i){const q=f.q.toLowerCase();return(!q||i.k.toLowerCase().includes(q)||i.s.toLowerCase().includes(q))&&(!f.mine||i.a==='AM')&&(!f.recent||i.u)&&(!f.type||i.t===f.type)&&(!f.pri||['high','highest'].includes(i.p))}
function card(i,ix){return `<article class="card" tabindex="0" draggable="true" data-k="${i.k}" style="--tc:${tc[i.t]};animation-delay:${ix*25}ms"><span class="k">${i.k}</span><p>${esc(i.s)}</p><div class="row"><span class="tag">${typeName(i.t)}</span>${i.l.map(l=>`<span class="tag">${esc(l)}</span>`).join('')}<span class="spacer"></span>${priIcon(i.p)}${av(i.a)}</div></article>`}
function render(){
  const vis=issues.filter(ok);
  $('#ctBoard').textContent=vis.length;
  let h=`<div class="heads">${cols.map(c=>{const n=issues.filter(i=>i.st===c.id).length;const over=c.wip&&n>c.wip;return `<div class="h ${over?'over':''}" style="--hc:${c.c}">${c.n}<span class="wip">${c.wip?`${n}/${c.wip} WIP`:n}</span></div>`}).join('')}</div>`;
  const lanes=group==='none'?[{id:'*',n:'All issues'}]:[...Object.keys(people).map(id=>({id,n:people[id].n})),{id:'none',n:'Unassigned'}];
  lanes.forEach(L=>{
    const li=vis.filter(i=>L.id==='*'||(i.a||'none')===L.id);if(!li.length&&L.id!=='*')return;
    h+=`<section class="lane ${closed.has(L.id)?'closed':''}" data-lane="${L.id}">${L.id==='*'?'':`<button class="lane-h" aria-expanded="${!closed.has(L.id)}"><span class="chev">▾</span>${L.id==='none'?av(null):av(L.id)}<b>${L.n}</b><span class="ct">${li.length} issue${li.length>1?'s':''}</span></button>`}<div class="lane-g">${cols.map(c=>{const ci=li.filter(i=>i.st===c.id);return `<div class="cell" data-col="${c.id}" data-lane="${L.id}">${ci.map(card).join('')}${c.id==='todo'?`<div class="quick"><input aria-label="What needs to be done?" placeholder="What needs to be done?"><small>Enter to create · Esc to cancel</small></div><button class="add">+ Create issue</button>`:''}</div>`}).join('')}</div></section>`;
  });
  if(!vis.length)h+=`<p style="padding:40px;text-align:center;color:var(--faint)">No cards match these filters.</p>`;
  $('#board').innerHTML=h;wire();
}
function wire(){
  document.querySelectorAll('.card').forEach(el=>{el.onclick=()=>openIssue(el.dataset.k);el.onkeydown=e=>{if(e.key==='Enter')openIssue(el.dataset.k)};el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.k)});
  document.querySelectorAll('.cell').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('drop')};c.ondragleave=()=>c.classList.remove('drop');c.ondrop=e=>{e.preventDefault();const i=issues.find(x=>x.k===e.dataTransfer.getData('text/plain'));if(!i)return;const from=i.st;i.st=c.dataset.col;if(c.dataset.lane!=='*')i.a=c.dataset.lane==='none'?null:c.dataset.lane;i.u=1;log(i,from);render();toast(`${i.k} → ${cols.find(x=>x.id===i.st).n}`)}});
  document.querySelectorAll('.lane-h').forEach(b=>b.onclick=()=>{const id=b.parentElement.dataset.lane;closed.has(id)?closed.delete(id):closed.add(id);render()});
  document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{const q=b.previousElementSibling;q.classList.add('open');b.style.display='none';const inp=q.querySelector('input');inp.focus();inp.onkeydown=e=>{if(e.key==='Escape'){render()}if(e.key==='Enter'&&inp.value.trim()){const lane=b.closest('.cell').dataset.lane;const k='PIRA-'+(++seq);issues.unshift({k,s:inp.value.trim(),t:'task',p:'medium',a:lane==='*'||lane==='none'?null:lane,st:'todo',l:[],r:'AM',u:1});render();toast(k+' created')}}});
}
function log(i,from){(i.h=i.h||[]).unshift({f:cols.find(c=>c.id===from).n,t:cols.find(c=>c.id===i.st).n})}
function openIssue(k){
  const i=issues.find(x=>x.k===k);
  $('#issue').innerHTML=`<div class="i-top"><svg width="16" height="16"><rect width="16" height="16" rx="3" fill="${hex[i.t]}"/></svg><span class="crumb2">PIRA-107 /</span><span class="k">${i.k}</span><button class="ib" id="copy" aria-label="Copy key" title="Copy key">⧉</button><span class="spacer"></span><button class="ib" aria-label="Watch">👁</button><button class="ib" aria-label="Share">⤴</button><button class="ib" aria-label="More">⋯</button><button class="ib" id="x" aria-label="Close">✕</button></div>
  <div class="i-grid"><div class="i-left"><h2 id="iTitle" contenteditable="true" spellcheck="false">${esc(i.s)}</h2>
   <div class="qa"><button>📎 Attach</button><button>⊞ Add child issue</button><button>🔗 Link issue</button></div>
   <div class="lbl-t">Description</div><div class="desc">The board should keep each card's rank after a refresh.<ul><li>Rank persists server-side</li><li>Concurrent moves resolve without duplicates</li><li>Keyboard alternative to drag</li></ul></div>
   <div class="lbl-t">Child issues</div><div class="sub"><div><svg width="14" height="14"><rect width="14" height="14" rx="3" fill="#4aa3ff"/></svg><span class="k">PIRA-120</span>Write rank strategy notes<span class="spacer" style="flex:1"></span><span class="bar2"><i style="width:60%"></i></span></div><div><svg width="14" height="14"><rect width="14" height="14" rx="3" fill="#4aa3ff"/></svg><span class="k">PIRA-121</span>Add reorder unit tests<span style="flex:1"></span><span class="bar2"><i style="width:10%"></i></span></div></div>
   <div class="lbl-t">Activity</div>
   <div class="composer" style="display:flex;gap:10px;margin-bottom:16px">${av('AM','lg')}<textarea id="cmt" placeholder="Add a comment… Enter to save"></textarea></div>
   <div class="feed" id="feed">${(i.c||[]).map(c=>`<div class="post">${av('AM','lg')}<div class="bub"><b>Alex Morgan</b> <small>just now</small><div>${esc(c)}</div></div></div>`).join('')}${(i.h||[]).map(h=>`<div class="post h">${av('AM','lg')}<div class="bub"><b>You</b> changed the Status <span class="chip">${h.f}</span> → <span class="chip">${h.t}</span> · just now</div></div>`).join('')}
    <div class="post">${av('PS','lg')}<div class="bub"><b>Priya Shah</b> <small>2 hours ago</small><div>Repro: drag twice, refresh — order resets to created date.</div></div></div>
    <div class="post h">${av(i.r,'lg')}<div class="bub"><b>${people[i.r].n}</b> created the issue · 3 days ago</div></div></div>
  </div>
  <div class="i-right"><div class="status"><label class="sr" for="st">Status</label><select id="st" class="st-${i.st}">${cols.map(c=>`<option value="${c.id}" ${c.id===i.st?'selected':''}>${c.n}</option>`).join('')}</select></div>
   <details class="box" open><summary>Details <span>▾</span></summary><dl>
    <dt>Assignee</dt><dd>${av(i.a)} ${i.a?people[i.a].n:'Unassigned'}</dd>
    <dt>Reporter</dt><dd>${av(i.r)} ${people[i.r].n}</dd>
    <dt>Priority</dt><dd>${priIcon(i.p)} ${typeName(i.p)}</dd>
    <dt>Type</dt><dd>${typeName(i.t)}</dd>
    <dt>Labels</dt><dd>${i.l.map(l=>`<span class="tag">${esc(l)}</span>`).join(' ')||'None'}</dd>
    <dt>Due date</dt><dd>21 Oct 2026</dd>
    <dt>Parent</dt><dd><span class="k" style="font:500 12px var(--mono);color:var(--cyan)">PIRA-107</span> Phase 1</dd></dl></details>
   <div class="meta-foot">Created 3 days ago<br>Updated just now</div></div></div>`;
  $('#scrim').classList.add('open');
  $('#x').onclick=closeIssue;$('#copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(i.k);toast('Copied '+i.k)};
  $('#st').onchange=e=>{const from=i.st;i.st=e.target.value;i.u=1;log(i,from);render();openIssue(k);toast(`${i.k} → ${cols.find(c=>c.id===i.st).n}`)};
  $('#cmt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.value.trim()){e.preventDefault();(i.c=i.c||[]).unshift(e.target.value.trim());openIssue(k)}};
  setTimeout(()=>$('#x').focus(),10);
}
function closeIssue(){$('#scrim').classList.remove('open')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2000)}
document.querySelectorAll('.fchip').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);if(b.dataset.f)f[b.dataset.f]=on;if(b.dataset.type){document.querySelectorAll('[data-type]').forEach(x=>x!==b&&x.setAttribute('aria-pressed','false'));f.type=on?b.dataset.type:''}if(b.dataset.pri)f.pri=on?'high':'';render()});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));group=b.dataset.g;render()});
$('#q').oninput=e=>{f.q=e.target.value;render()};
$('#togglePP').onclick=()=>$('#app').classList.toggle('slim');
$('#scrim').onclick=e=>{if(e.target.id==='scrim')closeIssue()};
$('#railCreate').onclick=()=>{group='none';document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.g==='none'));render();document.querySelector('.add').click()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeIssue();if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='/'){e.preventDefault();$('#q').focus()}if(e.key==='c'){e.preventDefault();$('#railCreate').click()}});
render();
</script>
</body>
</html>
